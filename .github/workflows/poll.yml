name: poll

# A single job polls for ~5h40m, saves state, then dispatches its successor.
# Cron alone is too coarse (5 min minimum, often delayed); here it only restarts
# the chain if it ever breaks. The concurrency group keeps exactly one poller alive.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: poller
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        run: |
          mkdir -p state
          if git fetch -q --depth=1 origin state; then
            git show origin/state:state.json > state/state.json
          else
            echo "no saved state yet — first poll seeds silently"
          fi

      - name: Poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MINUTES: "340"
          PYTHONUNBUFFERED: "1"
        run: python -m bot.main

      # State lives on a single-commit orphan branch so main's history stays clean.
      - name: Save state
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [ -f state/state.json ] || exit 0
          cd "$(mktemp -d)"
          git init -q -b state
          cp "$GITHUB_WORKSPACE/state/state.json" .
          git add state.json
          git -c user.name="nba-alert-bot" -c user.email="nba-alert-bot@users.noreply.github.com" \
            commit -qm "state $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state

      - name: Start next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run poll.yml --ref "${GITHUB_REF_NAME}"
